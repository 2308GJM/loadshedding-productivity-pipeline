AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Load-shedding productivity pipeline — fetches EskomSePush schedule data,
  cross-references it with personal coding activity, and stores lost-hours summaries.

Parameters:
  SePushToken:
    Type: String
    NoEcho: true
    Description: EskomSePush API token
  SePushAreaId:
    Type: String
    Description: EskomSePush area ID for your location
  GitHubUsername:
    Type: String
    Description: GitHub username to pull commit activity from

Resources:
  ScheduleDataBucket:
    Type: AWS::S3::Bucket

  FetchScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/fetch_schedule/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          BUCKET_NAME: !Ref ScheduleDataBucket
          SEPUSH_TOKEN: !Ref SePushToken
          SEPUSH_AREA_ID: !Ref SePushAreaId
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ScheduleDataBucket
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)

  ProcessDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/process_data/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 60
      Environment:
        Variables:
          RESULTS_TABLE: !Ref ResultsTable
          GITHUB_USERNAME: !Ref GitHubUsername
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref ScheduleDataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ResultsTable
      Events:
        S3Trigger:
          Type: S3
          Properties:
            Bucket: !Ref ScheduleDataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/

  ResultsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: date
        Type: String

Outputs:
  BucketName:
    Value: !Ref ScheduleDataBucket
  ResultsTableName:
    Value: !Ref ResultsTable
